name: Android APK

on:
  pull_request:
    branches: [master]
    paths: ['flutter_app/**', 'tools/verify_android_release.py', 'tests/test_android_release.py', '.github/workflows/android-apk.yml']
  push:
    branches: [master]
    paths: ['flutter_app/**', 'tools/verify_android_release.py', 'tests/test_android_release.py', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Test release verification
        working-directory: .
        run: python3 -m unittest discover -s tests -p test_android_release.py
      - name: Build pull-request test APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --build-number "$GITHUB_RUN_NUMBER"
      - name: Restore release signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Android release keystore secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moonleaf-release.jks"
      - name: Build signed release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          MOONLEAF_KEYSTORE_PATH: ${{ runner.temp }}/moonleaf-release.jks
          MOONLEAF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOONLEAF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOONLEAF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify release signature and package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 ../tools/verify_android_release.py build/app/outputs/flutter-apk/app-release.apk "$GITHUB_RUN_NUMBER"
      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/moonleaf-release.jks"
      - name: Prepare download and checksum
        run: |
          mkdir -p dist
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            cp build/app/outputs/flutter-apk/app-debug.apk dist/chapter-and-verse.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk dist/chapter-and-verse.apk
          fi
          cd dist
          sha256sum chapter-and-verse.apk > chapter-and-verse.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: flutter_app/dist/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            bundle: build/linux/x64/release/bundle/
          - os: windows-latest
            target: windows
            bundle: build/windows/x64/runner/Release/
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: flutter_app/${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: dist
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-build-$GITHUB_RUN_NUMBER"
          cat > release-notes.md <<EOF
          ## Download
          Download **chapter-and-verse.apk** below and install it on your Android device.
          This universal **release APK** uses Moonleaf's permanent signing key.
          Install it over an earlier signed release to update without removing your library.
          Builds 48 and earlier used temporary debug keys and may need one final reinstall.
          Save your EPUBs before removing an old debug build. See the website's install guide.

          ## Runs on your phone
          No server, Python installation, or account is required. Paste a supported novel URL,
          extract chapters on your phone, and save the EPUB using the native file dialog.
          Internet is needed to fetch chapters. Downloads continue in the background,
          and saved books can be read offline in Moonleaf's built-in reader.
          See the [setup instructions](https://github.com/$GH_REPO/blob/$GITHUB_SHA/README.md).

          Built from commit $GITHUB_SHA. The SHA-256 checksum is attached.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" \
              --title "Moonleaf — Android build $GITHUB_RUN_NUMBER" \
              --notes-file release-notes.md --latest
          fi
