name: novel_to_epub
description: A thoughtful home for turning web novels into EPUB books.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  file_saver: ^0.7.0
  html: ^0.15.7
  archive: ^4.3.0
  xml: ^7.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  flutter_tts: ^4.2.5
  sherpa_onnx: 1.13.8
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/android-update.json
    - assets/icon.png
    - assets/fonts/Fraunces-LICENSE.txt
    - assets/fonts/DMSans-LICENSE.txt
    - assets/dictionary/wordnet.txt.gz
    - assets/dictionary/WordNet-LICENSE.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
